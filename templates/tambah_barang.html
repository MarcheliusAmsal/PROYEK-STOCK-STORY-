{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Tambah Barang Baru</h1>
    <div class="header-actions">
        <a href="{{ url_for('data_barang') }}" class="btn-outline-ss">
            <span class="material-symbols-outlined">arrow_back</span>
            Kembali
        </a>
    </div>
</div>

<div class="ss-card">
    <div class="card-header-custom">
        <span class="card-title">Formulir Barang Baru</span>
    </div>
    <div class="card-body-custom">
        <form method="POST" action="{{ url_for('tambah_barang') }}">
            <div class="row">
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="nama">Nama Barang <span style="color:var(--danger);">*</span></label>
                        <input type="text" id="nama" name="nama" class="ss-input" placeholder="Masukkan nama barang" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="kategori">Kategori <span style="color:var(--danger);">*</span></label>
                        <select id="kategori" name="kategori" class="ss-select" required>
                            <option value="">Pilih Kategori</option>
                            {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="ss-form-group">
                        <label for="stok">Stok Awal <span style="color:var(--danger);">*</span></label>
                        <input type="number" id="stok" name="stok" class="ss-input" placeholder="0" min="0" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="ss-form-group">
                        <label for="satuan">Satuan <span style="color:var(--danger);">*</span></label>
                        <select id="satuan" name="satuan" class="ss-select" required>
                            <option value="">Pilih Satuan</option>
                            <option value="Unit">Unit</option>
                            <option value="Pcs">Pcs</option>
                            <option value="Rim">Rim</option>
                            <option value="Botol">Botol</option>
                            <option value="Lusin">Lusin</option>
                            <option value="Kg">Kg</option>
                            <option value="Liter">Liter</option>
                            <option value="Box">Box</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="ss-form-group">
                        <label for="stok_min">Stok Minimum</label>
                        <input type="number" id="stok_min" name="stok_min" class="ss-input" placeholder="0" min="0" value="0">
                        <div class="form-hint">Batas peringatan stok rendah</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="harga">Harga (Rp) <span style="color:var(--danger);">*</span></label>
                        <input type="number" id="harga" name="harga" class="ss-input" placeholder="0" min="0" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="lokasi">Lokasi Penyimpanan</label>
                        <input type="text" id="lokasi" name="lokasi" class="ss-input" placeholder="Contoh: Gudang A">
                    </div>
                </div>
            </div>

            <div class="ss-form-group">
                <label for="deskripsi">Deskripsi</label>
                <textarea id="deskripsi" name="deskripsi" class="ss-textarea" placeholder="Deskripsi singkat barang..."></textarea>
            </div>

            <div style="display:flex; gap:12px; justify-content:flex-end; padding-top:12px; border-top:1px solid var(--border-light);">
                <a href="{{ url_for('data_barang') }}" class="btn-outline-ss">Batal</a>
                <button type="submit" class="btn-primary-ss">
                    <span class="material-symbols-outlined">save</span>
                    Simpan Barang
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
