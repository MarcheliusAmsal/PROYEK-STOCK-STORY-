{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Edit Barang</h1>
    <div class="header-actions">
        <a href="{{ url_for('data_barang') }}" class="btn-outline-ss">
            <span class="material-symbols-outlined">arrow_back</span>
            Kembali
        </a>
    </div>
</div>

<div class="ss-card">
    <div class="card-header-custom">
        <span class="card-title">Edit: {{ barang.nama }} ({{ barang.kode }})</span>
    </div>
    <div class="card-body-custom">
        <form method="POST" action="{{ url_for('edit_barang', barang_id=barang.id) }}">
            <div class="row">
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="nama">Nama Barang <span style="color:var(--danger);">*</span></label>
                        <input type="text" id="nama" name="nama" class="ss-input" value="{{ barang.nama }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="kategori">Kategori <span style="color:var(--danger);">*</span></label>
                        <select id="kategori" name="kategori" class="ss-select" required>
                            <option value="">Pilih Kategori</option>
                            {% for cat in categories %}
                            <option value="{{ cat }}" {{ 'selected' if barang.kategori == cat }}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="ss-form-group">
                        <label for="stok">Stok <span style="color:var(--danger);">*</span></label>
                        <input type="number" id="stok" name="stok" class="ss-input" value="{{ barang.stok }}" min="0" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="ss-form-group">
                        <label for="satuan">Satuan <span style="color:var(--danger);">*</span></label>
                        <select id="satuan" name="satuan" class="ss-select" required>
                            {% for s in ['Unit','Pcs','Rim','Botol','Lusin','Kg','Liter','Box'] %}
                            <option value="{{ s }}" {{ 'selected' if barang.satuan == s }}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="ss-form-group">
                        <label for="stok_min">Stok Minimum</label>
                        <input type="number" id="stok_min" name="stok_min" class="ss-input" value="{{ barang.stok_min }}" min="0">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="harga">Harga (Rp) <span style="color:var(--danger);">*</span></label>
                        <input type="number" id="harga" name="harga" class="ss-input" value="{{ barang.harga }}" min="0" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="ss-form-group">
                        <label for="lokasi">Lokasi Penyimpanan</label>
                        <input type="text" id="lokasi" name="lokasi" class="ss-input" value="{{ barang.lokasi }}">
                    </div>
                </div>
            </div>

            <div class="ss-form-group">
                <label for="deskripsi">Deskripsi</label>
                <textarea id="deskripsi" name="deskripsi" class="ss-textarea">{{ barang.deskripsi }}</textarea>
            </div>

            <div style="display:flex; gap:12px; justify-content:flex-end; padding-top:12px; border-top:1px solid var(--border-light);">
                <a href="{{ url_for('data_barang') }}" class="btn-outline-ss">Batal</a>
                <button type="submit" class="btn-primary-ss">
                    <span class="material-symbols-outlined">save</span>
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
